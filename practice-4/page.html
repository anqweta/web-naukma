<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Task 8 — Слайдер зображень</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 1rem;
      }
      h1 {
        color: #2050a0;
      }
      .slider {
        position: relative;
        max-width: 600px;
        margin: 2rem auto;
      }
      .slides {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #ccd;
        border-radius: 8px;
        overflow: hidden;
      }
      .slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        color: white;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .slide.active {
        opacity: 1;
      }
      /* Замість справжніх фото — кольорові «заглушки» */
      .slide:nth-child(1) {
        background: #2050a0;
      }
      .slide:nth-child(2) {
        background: #b85c00;
      }
      .slide:nth-child(3) {
        background: #2a8a4a;
      }
      .slide:nth-child(4) {
        background: #c33;
      }
      .slide:nth-child(5) {
        background: #553388;
      }

      .prev,
      .next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        font-size: 2rem;
        padding: 8px 16px;
        cursor: pointer;
        border-radius: 50%;
      }
      .prev {
        left: 10px;
      }
      .next {
        right: 10px;
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 1rem;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ccd;
        cursor: pointer;
      }
      .dot.active {
        background: #2050a0;
      }
    </style>
  </head>
  <body>
    <h1>Слайдер</h1>

    <div class="slider" tabindex="0">
      <div class="slides">
        <div class="slide active">Слайд 1</div>
        <div class="slide">Слайд 2</div>
        <div class="slide">Слайд 3</div>
        <div class="slide">Слайд 4</div>
        <div class="slide">Слайд 5</div>
      </div>
      <button class="prev">‹</button>
      <button class="next">›</button>
      <div class="dots">
        <span class="dot active" data-slide="0"></span>
        <span class="dot" data-slide="1"></span>
        <span class="dot" data-slide="2"></span>
        <span class="dot" data-slide="3"></span>
        <span class="dot" data-slide="4"></span>
      </div>
    </div>

    <script src="slider.js"></script>
  </body>
</html>
