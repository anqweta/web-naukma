<body>
<h1>Вгадай число від 1 до 100</h1>
  <p>Маєш <strong>7 спроб</strong>. Введи число і натисни кнопку.</p>
  <div>
    <input id="playerName" type="text" placeholder="Введіть ваше ім'я" autofocus />
    <input id="guess" type="number" min="1" max="100" />
    <button onclick="getNumber()" id="submit">Перевірити</button>
    <button onclick="restartGame()" id="restart">Почати заново</button>
  </div>
  <p id="message"></p>
  <p id="attempts"></p>
  <h2>Результати</h2>
  <table>
    <thead>
      <tr>
        <th>Гравець</th>
        <th>Спроби</th>
        <th>Результат</th>
      </tr>
    </thead>
    <tbody id="results">
      </tbody>
  </table>

  <script>
    // ============================================================
    // Завдання 8 — Гра «Вгадай число»
    // ============================================================
    //
    // 1. Програма обирає число від 1 до 100 (Math.random).
    // 2. Користувач вводить здогад → "менше"/"більше"/"вгадав".
    // 3. Максимум 7 спроб.
    // 4. Валідація: число у діапазоні 1-100.
    // 5. Перезапуск після перемоги/поразки.
    //
    // БОНУС: таблиця рекордів через localStorage.
    // ============================================================

    // TODO: ваш код
    let randomNumber = Math.floor(Math.random() * 100) + 1;
    let attemptsLeft = 7;
    let gameOver = false;
    let win = false;

    const messageElement = document.getElementById('message');
    const attemptsElement = document.getElementById('attempts');

    function getNumber() {
    let inputValue = Number(document.getElementById('guess').value);
        if (inputValue < 1 || inputValue > 100) {
            alert('Будь ласка, введіть число від 1 до 100.');
            return;
        }
        attemptsLeft--;
        if (inputValue < randomNumber) {
            messageElement.textContent = 'Загадане число більше.';
        } else if (inputValue > randomNumber) {
            messageElement.textContent = 'Загадане число менше.';
        }
        if (inputValue === randomNumber) {
            messageElement.textContent = 'Вітаємо! Ви вгадали число!';
            gameOver = true;
            win = true;
            document.getElementById('submit').disabled = true;
            drawTable();
        }
        attemptsElement.textContent = `Залишилось спроб: ${attemptsLeft}`;
            if (attemptsLeft === 0) {
            messageElement.textContent = `Гра закінчена! Загадане число було: ${randomNumber}`;
            gameOver = true;
            document.getElementById('submit').disabled = true;
            drawTable();
            return;
    }
}   

    function restartGame() {
        if (gameOver) {
        randomNumber = Math.floor(Math.random() * 100) + 1;
        attemptsLeft = 7;
        gameOver = false;
        win = false;
        document.getElementById('submit').disabled = false;
        messageElement.textContent = '';
        attemptsElement.textContent = `Залишилось спроб: ${attemptsLeft}`;
        }
    }

    function drawTable() {
            const playerNameInput = document.getElementById('playerName').value;
            if (gameOver) {
    const table = document.getElementById('results');
    const row = table.insertRow();
    const cellName = row.insertCell();
    const cellAttempts = row.insertCell();
    const cellResult = row.insertCell();
    cellName.textContent = playerNameInput;
    cellAttempts.textContent = 7 - attemptsLeft;
    let leaderboard = localStorage.getItem('results');
    if (win) {
        cellResult.textContent = 'Перемога';
    } else {
        cellResult.textContent = 'Поразка';
    }
    }
    }

</script>

</body>
</html>
